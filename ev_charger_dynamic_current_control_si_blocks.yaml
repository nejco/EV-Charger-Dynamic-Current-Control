blueprint:
  name: EV Charger Dynamic Current Control (External Time Block)
  description: >
    Dynamically adjusts EV charger current to stay below the agreed power for the
    currently active time block. The active block must be provided by an entity
    whose state is 1, 2, 3, 4, or 5.

    Block values are entered in watts.
    The block value is treated as a hard upper limit.
    Tolerance is only used when deciding whether it is safe to increase current.

    Step power is calculated assuming a 3-phase 230 V connection (690 W per amp).
    Increases only happen when the extra power of the next step still fits under
    the block limit minus the tolerance. When over the limit, the current can
    jump down several steps at once to get back under it quickly.

    Fail-safe: while the power meter or time block entity is unavailable or
    non-numeric, the charger is set to the lowest allowed current. Normal
    control resumes automatically when the data comes back.
  domain: automation
  input:
    charger_entity:
      name: Charger current entity
      description: Number entity used to set charger current.
      selector:
        entity:
          domain: number

    power_meter_entity:
      name: Power meter entity
      description: Sensor with net grid power in watts. Positive should mean import from grid.
      selector:
        entity:
          domain: sensor

    time_block_entity:
      name: Time block entity
      description: Entity whose state is the current time block (1-5).
      selector:
        entity: {}

    supported_current_settings:
      name: Supported current settings
      description: Comma-separated list of allowed charging currents, e.g. 6,8,10,13,16
      default: "6,8,10,13,16"
      selector:
        text: {}

    tolerance:
      name: Increase tolerance
      description: >
        Safety margin in watts used only before increasing charging current.
        Charging current will only increase if measured power plus the power
        added by the next step stays at least this much below the block limit.
      default: 300
      selector:
        number:
          min: 0
          max: 10000
          step: 50
          unit_of_measurement: W
          mode: box

    agreed_power_block_1:
      name: Agreed power - block 1
      description: Hard upper limit for block 1, in watts.
      default: 6500
      selector:
        number:
          min: 0
          max: 50000
          step: 100
          unit_of_measurement: W
          mode: box

    agreed_power_block_2:
      name: Agreed power - block 2
      description: Hard upper limit for block 2, in watts.
      default: 8000
      selector:
        number:
          min: 0
          max: 50000
          step: 100
          unit_of_measurement: W
          mode: box

    agreed_power_block_3:
      name: Agreed power - block 3
      description: Hard upper limit for block 3, in watts.
      default: 8000
      selector:
        number:
          min: 0
          max: 50000
          step: 100
          unit_of_measurement: W
          mode: box

    agreed_power_block_4:
      name: Agreed power - block 4
      description: Hard upper limit for block 4, in watts.
      default: 14000
      selector:
        number:
          min: 0
          max: 50000
          step: 100
          unit_of_measurement: W
          mode: box

    agreed_power_block_5:
      name: Agreed power - block 5
      description: Hard upper limit for block 5, in watts.
      default: 15000
      selector:
        number:
          min: 0
          max: 50000
          step: 100
          unit_of_measurement: W
          mode: box

mode: single
max_exceeded: silent

trigger:
  - platform: time_pattern
    minutes: "/1"
  - platform: state
    entity_id: !input time_block_entity

variables:
  charger_entity: !input charger_entity
  power_meter_entity: !input power_meter_entity
  time_block_entity: !input time_block_entity
  tolerance: !input tolerance
  supported_current_settings_raw: !input supported_current_settings

  agreed_power_block_1: !input agreed_power_block_1
  agreed_power_block_2: !input agreed_power_block_2
  agreed_power_block_3: !input agreed_power_block_3
  agreed_power_block_4: !input agreed_power_block_4
  agreed_power_block_5: !input agreed_power_block_5

  # Assumes a 3-phase 230 V connection: 3 x 230 V = 690 W per amp.
  watts_per_amp: 690

  valid_amps: >
    {{ supported_current_settings_raw
       .split(',')
       | map('trim')
       | reject('eq', '')
       | map('int', 0)
       | select('gt', 0)
       | unique
       | list
       | sort }}

  grid_power: "{{ states(power_meter_entity) | float(0) }}"
  current_amp: "{{ states(charger_entity) | float(0) | round(0) | int }}"
  current_block: "{{ states(time_block_entity) | int(0) }}"

  data_ok: >
    {{ is_number(states(power_meter_entity))
       and current_block in [1, 2, 3, 4, 5] }}

  block_limit_w: >
    {% if current_block in [1, 2, 3, 4, 5] %}
      {{ [0,
          agreed_power_block_1,
          agreed_power_block_2,
          agreed_power_block_3,
          agreed_power_block_4,
          agreed_power_block_5][current_block] | float(0) }}
    {% else %}
      0
    {% endif %}

  next_up: >
    {% set up = valid_amps | select('gt', current_amp) | list %}
    {{ up[0] if up | length > 0 else current_amp }}

  next_down_multi: >
    {% set overshoot = grid_power - block_limit_w %}
    {% set shed = (overshoot / watts_per_amp) | round(0, 'ceil') | int %}
    {% set target = current_amp - shed %}
    {% set candidates = valid_amps | select('le', target) | list %}
    {% if candidates | length > 0 %}
      {{ candidates[-1] }}
    {% elif valid_amps | length > 0 %}
      {{ valid_amps[0] }}
    {% else %}
      {{ current_amp }}
    {% endif %}

  should_decrease: "{{ data_ok and grid_power > block_limit_w }}"

  step_up_w: "{{ ((next_up | int) - current_amp) * watts_per_amp }}"

  should_increase: >
    {{ data_ok
       and (grid_power + step_up_w) <= (block_limit_w - tolerance) }}

  new_amp: >
    {% if valid_amps | length == 0 %}
      {{ current_amp }}
    {% elif not data_ok %}
      {{ valid_amps[0] }}
    {% elif should_decrease %}
      {{ next_down_multi | int }}
    {% elif should_increase %}
      {{ next_up | int }}
    {% else %}
      {{ current_amp | int }}
    {% endif %}

  delta_amp: "{{ (new_amp | int) - (current_amp | int) }}"

action:
  - choose:
      - conditions:
          - condition: template
            value_template: >
              {{ valid_amps | length > 0
                 and delta_amp != 0 }}
        sequence:
          - service: number.set_value
            target:
              entity_id: !input charger_entity
            data:
              value: "{{ new_amp | int }}"
